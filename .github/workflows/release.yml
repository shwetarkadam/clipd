name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Telemetry endpoint — set in GitHub repo Settings → Secrets → Actions as CLIPD_TELEMETRY_ENDPOINT.
# Format: https://your-worker.workers.dev (no trailing slash).
# If unset or empty, telemetry is compiled out (zero binary cost, zero network calls).
env:
  CLIPD_TELEMETRY_ENDPOINT: ${{ secrets.CLIPD_TELEMETRY_ENDPOINT }}

jobs:
  build-macos:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (macos-13) removed: GitHub retired those runners, so the job
          # queued forever and blocked create-release (timeout-minutes only
          # counts once a job *starts*). Intel support can return later via
          # cross-compilation (x86_64-apple-darwin) on the arm64 runner.
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Build clipd-hud (Swift)
        run: |
          cd clipd-hud
          swiftc -O -o clipd-hud clipd-hud.swift -framework Cocoa
          cp -f clipd-hud ../target/release/clipd-hud
          chmod +x ../target/release/clipd-hud

      - name: Build clipd-ocr (Swift — Apple Vision OCR)
        run: |
          cd clipd-ocr
          swiftc -O -o clipd-ocr clipd-ocr.swift -framework Vision -framework AppKit
          cp -f clipd-ocr ../target/release/clipd-ocr
          chmod +x ../target/release/clipd-ocr

      # Import the self-signed "clipd-codesign" cert so every release shares one
      # stable identity. Without this, ad-hoc signing changes the signature hash
      # on each build and macOS silently drops Input Monitoring / Accessibility
      # grants — breaking multi-slot copy + HUD after every update.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 secret not set — falling back to ad-hoc signing (TCC grants will NOT persist)."
            echo "CLIPD_SIGN_ID=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/clipd-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/clipd-cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          echo "CLIPD_SIGN_ID=clipd-codesign" >> "$GITHUB_ENV"
          echo "Imported clipd-codesign signing identity."

      - name: Create Clipd.app bundle
        run: bash packaging/macos/create-app-bundle.sh

      - name: Code sign Clipd.app
        # Hardened runtime + timestamp are prerequisites for notarization;
        # without them notarytool rejects the submission.
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "${CLIPD_SIGN_ID:--}" target/release/Clipd.app

      - name: Notarize and staple
        # Signing alone is not enough. An un-notarized download is refused by
        # Gatekeeper — "cannot be opened because Apple cannot check it for
        # malicious software" — and the user has to right-click → Open or strip
        # the quarantine flag by hand. That is the single biggest install
        # friction on macOS, and it happens before the app has run once.
        #
        # Skipped with a warning when the credentials are absent, so a build
        # without them still produces artifacts rather than failing.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Apple notarization secrets not set — the download will be quarantined and users must right-click → Open."
            exit 0
          fi
          ditto -c -k --keepParent target/release/Clipd.app /tmp/clipd-notarize.zip
          xcrun notarytool submit /tmp/clipd-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Staple so the ticket travels with the app and Gatekeeper is happy
          # even on a machine that is offline.
          xcrun stapler staple target/release/Clipd.app
          xcrun stapler validate target/release/Clipd.app

      - name: Package zip (with .app + CLI)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="Clipd-macos-${{ matrix.arch }}-${VERSION}"
          mkdir -p "target/release/${ZIP_NAME}"
          cp -R target/release/Clipd.app "target/release/${ZIP_NAME}/"
          cp -f target/release/clipd "target/release/${ZIP_NAME}/"
          chmod +x "target/release/${ZIP_NAME}/clipd"
          cp -f install.sh README.md "target/release/${ZIP_NAME}/" || true
          cd target/release && zip -qr "${ZIP_NAME}.zip" "${ZIP_NAME}/"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG_NAME="Clipd-macos-${{ matrix.arch }}-${VERSION}.dmg"
          # hdiutil intermittently fails with "Resource busy" on GitHub runners
          # (Spotlight/diskarbitrationd race) — retry a few times.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Clipd" \
              -srcfolder "target/release/Clipd.app" \
              -ov -format UDZO \
              "target/release/${DMG_NAME}"; then
              exit 0
            fi
            echo "hdiutil attempt ${attempt} failed — retrying in 5s..."
            sleep 5
          done
          echo "::error::hdiutil failed after 5 attempts"
          exit 1

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-macos-${{ matrix.arch }}-zip
          path: target/release/Clipd-macos-*.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-macos-${{ matrix.arch }}-dmg
          path: target/release/Clipd-macos-*.dmg

  build-linux:
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            libxdo-dev \
            file \
            desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Strip binaries
        run: |
          for bin in clipd clipd-ui clipd-gui clipd-mcp; do
            if [ -f "target/release/${bin}" ]; then
              strip "target/release/${bin}"
            fi
          done

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="Clipd-linux-x86_64-${VERSION}"
          mkdir -p "target/release/${ZIP_NAME}"
          for bin in clipd clipd-ui clipd-gui clipd-mcp; do
            if [ -f "target/release/${bin}" ]; then
              cp -f "target/release/${bin}" "target/release/${ZIP_NAME}/"
              chmod +x "target/release/${ZIP_NAME}/${bin}"
            fi
          done
          cp -f install.sh README.md "target/release/${ZIP_NAME}/" || true
          cp -f packaging/linux/clipd.desktop "target/release/${ZIP_NAME}/"
          cp -f packaging/linux/install-desktop.sh "target/release/${ZIP_NAME}/"
          cp -f packaging/icons/clipd.svg "target/release/${ZIP_NAME}/"
          chmod +x "target/release/${ZIP_NAME}/install-desktop.sh"
          cd target/release && zip -qr "${ZIP_NAME}.zip" "${ZIP_NAME}/"

      - name: Build .deb package
        run: bash packaging/linux/create-deb.sh "${GITHUB_REF_NAME}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-linux-x86_64-zip
          path: target/release/Clipd-linux-*.zip

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-linux-x86_64-deb
          path: target/release/clipd_*.deb

  build-windows:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Build installer (Clipd-Setup.exe)
        shell: pwsh
        run: |
          # makensis is NOT on PATH on windows-latest — install via chocolatey.
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $Version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          foreach ($bin in @("clipd.exe", "clipd-ui.exe", "clipd-gui.exe", "clipd-mcp.exe", "clipd-overlay.exe", "clipd-picker.exe")) {
            Copy-Item "target/release/$bin" packaging/windows/
          }
          & $makensis /DVERSION=$Version packaging/windows/clipd-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "packaging/windows/Clipd-Setup-$Version.exe" "target/release/Clipd-Setup-v$Version.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-windows-installer
          path: target/release/Clipd-Setup-*.exe

      - name: Package zip
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}"
          $ZipName = "Clipd-windows-x86_64-${Version}"
          $Dir = "target/release/${ZipName}"
          New-Item -ItemType Directory -Path $Dir -Force
          foreach ($bin in @("clipd.exe", "clipd-ui.exe", "clipd-gui.exe", "clipd-overlay.exe", "clipd-picker.exe", "clipd-mcp.exe")) {
            $src = "target/release/$bin"
            if (Test-Path $src) { Copy-Item $src $Dir }
          }
          Copy-Item packaging/windows/Clipd.bat $Dir -ErrorAction SilentlyContinue
          Copy-Item packaging/windows/ClipdTray.vbs $Dir -ErrorAction SilentlyContinue
          Copy-Item packaging/windows/ClipdDebug.bat $Dir -ErrorAction SilentlyContinue
          Copy-Item install.ps1, README.md $Dir -ErrorAction SilentlyContinue
          Compress-Archive -Path $Dir -DestinationPath "target/release/${ZipName}.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipd-windows-x86_64-zip
          path: target/release/Clipd-windows-*.zip

  create-release:
    needs: [build-macos, build-linux, build-windows]
    # Publish whatever built — don't let one stuck/failed platform (e.g. a hung
    # macOS Intel runner) block releasing the Windows/Linux/arm64 artifacts.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Off deliberately. The generated changelog quotes PR and commit
          # titles verbatim, and one of ours said "notarized macOS build" — a
          # claim the build cannot make while the Apple secrets are unset and
          # the notarize step skips. A release page that overstates its own
          # signing status is worse than one with no changelog.
          generate_release_notes: false
          # Lead with the install script, because it is the only macOS path
          # that does not hit Gatekeeper.
          #
          # A .dmg downloaded in a browser is quarantined, and an app that is
          # signed but not notarized is then refused outright: "Apple could not
          # verify Clipd.app is free of malware". On macOS 15 that dialog has a
          # single Done button — the old right-click → Open escape hatch is
          # gone — so the user has to go digging in System Settings. The script
          # fetches the same build and clears the quarantine flag, so it just
          # opens. Anyone who scrolls to the files below should know what they
          # are choosing.
          body: |
            ## Install

            **macOS and Linux** — one line:

            ```
            curl -fsSL https://raw.githubusercontent.com/shwetarkadam/clipd/main/install.sh | bash
            ```

            Downloads the build below, puts **Clipd.app** in `/Applications`
            and the `clipd` CLI in `/usr/local/bin`, and clears the download's
            quarantine flag so macOS opens it without a security prompt.

            **Windows** — download `Clipd-Setup-*.exe`. SmartScreen warns on
            first run: *More info → Run anyway*. clipd is open source and
            unsigned.

            After installing, macOS asks for **Accessibility** and **Input
            Monitoring** — multi-slot copy reads the keyboard, so it cannot
            work without them.

            <details>
            <summary>If you download the .zip by hand instead</summary>

            macOS will refuse to open the app: *"Apple could not verify
            Clipd.app is free of malware that may harm your Mac."*

            Nothing is wrong with the build. clipd is code-signed, but Apple
            only stops showing that warning for apps that have been
            **notarized**, which requires a paid Apple Developer account. This
            project is open source and earns nothing, so it is not notarized.

            Open it anyway: **System Settings → Privacy & Security**, scroll to
            Security, click **Open Anyway**. On macOS 15 the warning dialog
            itself has only a *Done* button — the old right-click → Open
            shortcut no longer works.

            Or clear the flag yourself:

            ```
            xattr -dr com.apple.quarantine /Applications/Clipd.app
            ```

            The install command does this for you, which is why it is the
            recommended path.
            </details>

            ---

            **Changes:** see the
            [full changelog](https://github.com/shwetarkadam/clipd/commits/main).

          # The zips are not optional extras — install.sh downloads them by
          # name. Leaving them off made the one-line install, the path the
          # README recommends and the only one that avoids Gatekeeper, return a
          # 404 for every user. They fell back to the .dmg and hit the malware
          # warning, which is what made clipd look broken on first contact.
          #
          # One artifact per platform beyond that: the Windows installer, which
          # has no script path. The .dmg and .deb are gone — a second macOS
          # download that behaves worse than the first is not a choice worth
          # offering.
          files: |
            artifacts/Clipd-macos-*.zip
            artifacts/Clipd-linux-*.zip
            artifacts/Clipd-Setup-*.exe
